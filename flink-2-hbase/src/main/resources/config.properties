## hbase config
# Client root dir is unused for Get/Put (the cluster advertises file:///data/hbase).
# Left unset on purpose: pointing this at hdfs://localhost:9000 made clients look for a
# NameNode that this compose file does not run.
# 127.0.0.1, not localhost: localhost also resolves to ::1, and the published
# ZooKeeper port is IPv4. An IPv6 attempt is reset and the client never settles.
hbase.zookeeper.quorum=127.0.0.1
# 1s timeouts drop the first region lookup. HbaseClient copies these two values.
hbase.client.scanner.timeout.period=60000
hbase.rpc.timeout=60000


## mysql config
mysql.url=jdbc:mysql://localhost:3308/con?serverTimezone=GMT%2B8
mysql.name=root
mysql.pass=123456

## redis config 192.168.0.100
redis.host=localhost
redis.port=6379
redis.db=0


## kafka config
# Host processes use localhost:9092. Jobs running inside the compose network should use kafka:19092.
# kafka.zookeeper.connect is unused by kafka-clients 3.x; HBase still uses hbase.zookeeper.quorum above.
kafka.bootstrap.servers=localhost:9092
kafka.zookeeper.connect=127.0.0.1:2181